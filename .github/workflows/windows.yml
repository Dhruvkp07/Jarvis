name: Windows build and tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create environment
        run: python -m venv .venv
      - name: Test and package Jarvis
        run: .\setup.ps1 -Test -Build
      - name: Launch packaged app and verify Chrome
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process .\dist\Jarvis\Jarvis.exe -ArgumentList '--self-test','packaged-check.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged check failed: $($process.ExitCode)" }
          $result = Get-Content packaged-check.json -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw 'Missing packaged self-test result' }
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-x64
          path: dist/Jarvis/
          if-no-files-found: error

  native:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Verify Notepad, Chrome Open dialog and global stop
        run: python -u -m tests.windows_smoke --automated

  live-ollama:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Jarvis and local inference runtime
        run: |
          python -m pip install .
          curl -fLsS --retry 2 https://ollama.com/download/ollama-linux-amd64.tar.zst -o /tmp/ollama.tar.zst
          sudo tar --zstd -xf /tmp/ollama.tar.zst -C /usr/local
      - name: Use real local model to operate Chrome
        run: |
          ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/version; then break; fi
            sleep 1
          done
          ollama pull qwen2.5:3b
          python -u -m tests.live_ollama
