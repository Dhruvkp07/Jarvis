[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop"
version = "0.1.0"
description = "A task-driven Windows desktop and Chrome assistant"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "playwright>=1.55,<2",
    "PySide6>=6.8,<7",
    "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
    "pywin32>=309; sys_platform == 'win32'",
    "psutil>=6,<9; sys_platform == 'win32'",
    "Pillow>=11,<14; sys_platform == 'win32'",
]

[project.scripts]
jarvis = "jarvis.app:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
